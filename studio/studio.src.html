<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MorphBook Studio · حوّل الـPDF لكتاب تفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;700;800&family=Cairo:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@400;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;600;800&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/*__MB_CSS__*/
:root{--s-bg:#0f1420;--s-panel:#171e2d;--s-line:#273149;--s-ink:#e9eef7;--s-soft:#9aa6bd;--s-acc:#5b9dff;--s-acc2:#7c5cff;--s-ok:#3ddc97}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Cairo','Inter',system-ui,sans-serif;background:var(--s-bg);color:var(--s-ink);display:flex;flex-direction:column;overflow:hidden}
#app{flex:1;min-height:0;display:grid;grid-template-columns:390px 1fr}
html[dir="ltr"] body{font-family:'Inter','Cairo',system-ui,sans-serif}
aside{background:var(--s-panel);border-inline-end:1px solid var(--s-line);overflow-y:auto;padding:1.1rem 1.1rem 2rem}
.brand{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem}
.brand .logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;
  background:linear-gradient(135deg,var(--s-acc),var(--s-acc2));box-shadow:0 8px 22px rgba(91,157,255,.35)}
.brand b{display:block;font-size:1.05rem}.brand small{color:var(--s-soft);font-size:.75rem}
.lang{margin-inline-start:auto;font:inherit;font-size:.75rem;color:var(--s-soft);background:none;border:1px solid var(--s-line);border-radius:8px;padding:.2rem .5rem;cursor:pointer}
.drop{border:2px dashed var(--s-line);border-radius:16px;padding:1.3rem 1rem;text-align:center;cursor:pointer;transition:.2s;background:rgba(255,255,255,.02)}
.drop:hover,.drop.over{border-color:var(--s-acc);background:rgba(91,157,255,.08)}
.drop .big{font-size:2rem}.drop p{margin:.3rem 0;color:var(--s-soft);font-size:.85rem}
.drop b{color:var(--s-ink)}
fieldset{border:0;padding:0;margin:1rem 0 0}
legend{font-size:.72rem;font-weight:800;letter-spacing:.06em;color:var(--s-acc);margin-bottom:.4rem}
label.f{display:block;font-size:.78rem;color:var(--s-soft);margin:.45rem 0 .2rem}
input[type=text],input[type=number],select{width:100%;font:inherit;font-size:.88rem;color:var(--s-ink);background:#0f1522;border:1px solid var(--s-line);border-radius:10px;padding:.5rem .65rem}
input[type=text]:focus,select:focus{outline:2px solid var(--s-acc);outline-offset:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.chk{display:flex;align-items:center;gap:.5rem;font-size:.85rem;margin:.45rem 0}
.chk input{accent-color:var(--s-acc);width:16px;height:16px}
.themes{display:grid;grid-template-columns:repeat(6,1fr);gap:.35rem}
.themes button{aspect-ratio:1;border-radius:10px;border:2px solid transparent;cursor:pointer;position:relative}
.themes button[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 2px var(--s-acc)}
.btn{display:block;width:100%;margin-top:.7rem;font:inherit;font-weight:800;padding:.75rem;border-radius:12px;border:0;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--s-acc),var(--s-acc2));box-shadow:0 10px 24px rgba(91,157,255,.3)}
.btn.ghost{background:none;border:1px solid var(--s-line);box-shadow:none;color:var(--s-ink);font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.bar{height:6px;border-radius:3px;background:#0f1522;overflow:hidden;margin-top:.7rem}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--s-acc),var(--s-ok));transition:width .2s}
.status{font-size:.78rem;color:var(--s-soft);margin-top:.4rem;min-height:1.2em}
.note{font-size:.72rem;color:var(--s-soft);line-height:1.6;margin-top:1rem;border-top:1px solid var(--s-line);padding-top:.8rem}
main{position:relative;overflow:hidden}
#preview{position:absolute;inset:0}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--s-soft);padding:2rem}
.empty .art{font-size:4rem;margin-bottom:.5rem;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(-4deg)}}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;background:#0f1522;border:1px solid var(--s-line);border-radius:14px;padding:.3rem;margin-bottom:.9rem}
.tabs button{font:inherit;font-size:.84rem;font-weight:800;color:var(--s-soft);background:none;border:0;border-radius:10px;padding:.55rem .3rem;cursor:pointer}
.tabs button[aria-selected=true]{color:#fff;background:linear-gradient(135deg,var(--s-acc),var(--s-acc2))}
.step{border:1px solid var(--s-line);border-radius:14px;padding:.75rem .8rem .85rem;margin:0 0 .7rem;background:rgba(255,255,255,.015)}
.step h3{margin:0 0 .35rem;font-size:.86rem;display:flex;align-items:center;gap:.45rem}
.step h3 i{font-style:normal;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:.72rem;background:var(--s-acc);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.chips button{font:inherit;font-size:.78rem;color:var(--s-ink);background:#0f1522;border:1px solid var(--s-line);border-radius:999px;padding:.32rem .7rem;cursor:pointer}
.chips button[aria-pressed=true]{border-color:var(--s-acc);background:rgba(91,157,255,.18);color:#fff;font-weight:700}
.chips button .rec{color:var(--s-ok);font-size:.7rem;margin-inline-start:.2rem}
textarea{width:100%;font:inherit;font-size:.85rem;color:var(--s-ink);background:#0f1522;border:1px solid var(--s-line);border-radius:10px;padding:.5rem .65rem;resize:vertical}
textarea:focus{outline:2px solid var(--s-acc)}
textarea.code{font-family:ui-monospace,Consolas,monospace;font-size:.72rem;direction:ltr;text-align:left;min-height:9rem}
.links{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.5rem}
.links a{flex:1;text-align:center;font-size:.76rem;font-weight:700;color:var(--s-ink);text-decoration:none;border:1px solid var(--s-line);border-radius:10px;padding:.42rem .3rem}
.links a:hover{border-color:var(--s-acc)}
.hint{font-size:.74rem;color:var(--s-soft);line-height:1.6;margin:.35rem 0 0}
.report{margin-top:.6rem;border-radius:12px;padding:.6rem .75rem;font-size:.8rem;line-height:1.65;display:none}
.report.bad{display:block;background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.5)}
.report.ok{display:block;background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.45)}
.report ul{margin:.3rem 0 0;padding-inline-start:1.1rem}
.report .btn{margin-top:.5rem;padding:.55rem;font-size:.82rem}
[hidden]{display:none!important}
.pic{display:flex;align-items:center;gap:.4rem;padding:.45rem 0;border-top:1px solid var(--s-line);font-size:.78rem}
.pic span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pic button{font:inherit;font-size:.74rem;font-weight:700;color:var(--s-ink);background:#0f1522;border:1px solid var(--s-line);border-radius:9px;padding:.3rem .55rem;cursor:pointer}
.pic button.done{border-color:var(--s-ok);color:var(--s-ok)}
.sharelink{display:flex;gap:.35rem;margin-top:.45rem}.sharelink input{flex:1;direction:ltr;font-size:.75rem}
body.reader #app{grid-template-columns:1fr}body.reader aside{display:none}
.readbar{position:fixed;inset-inline-end:12px;top:64px;z-index:90;display:none;gap:.35rem}
body.reader .readbar{display:flex}
.readbar a,.readbar button{font:inherit;font-size:.74rem;font-weight:800;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--s-acc),var(--s-acc2));border:0;border-radius:10px;padding:.35rem .7rem;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.3)}
@media (max-width:820px){html,body{height:auto}body{overflow:auto}#app{flex:none;display:block}aside{border:0;overflow:visible}main{height:88vh;height:88svh}}
html:has(body.reader){height:100%}
@media (max-width:820px){html:has(body.reader),body.reader{height:100%}body.reader{overflow:hidden}body.reader #app{flex:1;display:grid}body.reader main{height:auto}}
</style>
</head>
<body>
<div id="app">
<aside>
  <div class="brand"><div class="logo">📖</div><div><b>MorphBook Studio</b><small data-t="tag"></small></div>
    <button class="lang" id="lang" type="button">EN</button></div>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabAi" aria-selected="true" data-t="tabAi"></button>
    <button type="button" role="tab" id="tabPdf" aria-selected="false" data-t="tabPdf"></button>
  </div>

  <section id="paneAi">
    <div class="step"><h3><i>1</i><span data-t="s1"></span></h3>
      <label class="f" data-t="topic"></label><input type="text" id="ivTopic">
      <label class="f" data-t="ivSubject"></label><div class="chips" id="ivSubject"></div>
      <label class="f" data-t="ivStage"></label><select id="ivGrade"></select>
      <label class="f" data-t="ivObj"></label><textarea id="ivObj" rows="3"></textarea>
    </div>
    <div class="step"><h3><i>2</i><span data-t="s2"></span></h3>
      <label class="f" data-t="ivLang"></label><div class="chips" id="ivLang"></div>
      <label class="f" data-t="ivLen"></label><div class="chips" id="ivLen"></div>
      <div class="row" style="margin-top:.4rem;align-items:center"><span class="hint" style="margin:0" data-t="ivLenOwn"></span><input type="number" id="ivLenCustom" min="8" max="40" step="2" inputmode="numeric"></div>
      <label class="f" data-t="ivStyle"></label><div class="chips" id="ivStyle"></div>
      <label class="f" data-t="ivChars"></label><input type="text" id="ivChars">
    </div>
    <div class="step"><h3><i>3</i><span data-t="s3"></span></h3>
      <div class="chips" id="ivMods"></div>
      <div id="ivQuizBox"><label class="f" data-t="ivQuiz"></label><div class="chips" id="ivQuiz"></div></div>
      <label class="f" data-t="ivPics"></label><div class="chips" id="ivPics"></div>
      <div id="ivStyleBox"><label class="f" data-t="ivPicStyle"></label><div class="chips" id="ivPicStyle"></div></div>
      <div class="chips" id="ivSvg" style="margin-top:.5rem"></div>
      <div id="ivYtBox"><label class="f" data-t="yt"></label><input type="text" id="ivYt" dir="ltr" placeholder="https://www.youtube.com/watch?v=…"></div>
      <label class="f" data-t="ivNotes"></label><input type="text" id="ivNotes">
    </div>
    <div class="step"><h3><i>4</i><span data-t="s4"></span></h3>
      <p class="hint" data-t="s4h"></p>
      <button class="btn" id="makePrompt" type="button" data-t="makePrompt"></button>
      <div id="promptBox" hidden>
        <textarea class="code" id="prompt" readonly></textarea>
        <div class="links"><a href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT ↗</a><a href="https://gemini.google.com/app" target="_blank" rel="noopener">Gemini ↗</a><a href="https://claude.ai/new" target="_blank" rel="noopener">Claude ↗</a></div>
      </div>
    </div>
    <div class="step"><h3><i>5</i><span data-t="s5"></span></h3>
      <textarea class="code" id="paste" data-ph="pastePh"></textarea>
      <button class="btn" id="buildAi" type="button" data-t="buildAi"></button>
      <div class="report" id="report"></div>
    </div>
  </section>

  <section id="panePdf" hidden>
    <div class="drop" id="drop" tabindex="0" role="button">
      <div class="big">📄</div>
      <p><b data-t="drop1"></b></p><p data-t="drop2"></p>
      <input type="file" id="file" accept="application/pdf,image/*,.json" multiple hidden>
    </div>
  </section>
  <div class="bar"><i id="bar"></i></div>
  <div class="status" id="status"></div>
  <div class="step" id="picsPanel" hidden><h3>🎨 <span data-t="picsTitle"></span></h3><p class="hint" data-t="picsHint"></p>
    <button class="btn ghost" id="picsCopyAll" type="button" data-t="picsCopyAll"></button><div id="picsList"></div></div>

  <fieldset><legend data-t="book"></legend>
    <label class="f" data-t="title"></label><input type="text" id="title">
    <div class="row"><div><label class="f" data-t="author"></label><input type="text" id="author"></div>
      <div><label class="f" data-t="org"></label><input type="text" id="org"></div></div>
    <div class="row"><div><label class="f" data-t="grade"></label><input type="text" id="grade"></div>
      <div><label class="f" data-t="subject"></label><input type="text" id="subject"></div></div>
    <label class="f" data-t="yt"></label><input type="text" id="yt" dir="ltr" placeholder="https://www.youtube.com/watch?v=…">
  </fieldset>

  <fieldset><legend data-t="look"></legend>
    <div class="themes" id="themes"></div>
    <div class="row"><div><label class="f" data-t="dir"></label>
      <select id="dir"><option value="auto" data-t="auto"></option><option value="rtl" data-t="rtl"></option><option value="ltr" data-t="ltr"></option></select></div>
      <div><label class="f" data-t="quality"></label>
      <select id="quality"><option value="900" data-t="q1"></option><option value="1200" selected data-t="q2"></option><option value="1600" data-t="q3"></option></select></div></div>
    <label class="chk"><input type="checkbox" id="hard" checked><span data-t="hard"></span></label>
    <label class="chk"><input type="checkbox" id="sound" checked><span data-t="sound"></span></label>
    <label class="chk"><input type="checkbox" id="split"><span data-t="split"></span></label>
  </fieldset>

  <button class="btn" id="export" disabled data-t="export"></button>
  <button class="btn ghost" id="exportJson" disabled data-t="exportJson"></button>
  <button class="btn ghost" id="share" disabled hidden data-t="share"></button>
  <div class="report" id="shareBox"></div>
  <p class="note" data-t="note"></p>
</aside>
<main>
  <div class="readbar"><button type="button" id="readDl">⬇</button><a href="./" id="readMake">✏️</a></div>
  <div id="preview"></div>
  <div class="empty" id="empty"><div><div class="art">📚</div><p data-t="empty"></p></div></div>
</main>
</div>

<script>/*__PDFJS__*/</script>

<script>
(function () {
  'use strict';
  var T = {
    ar: { tag: 'من PDF لكتاب بيتقلّب بجد', drop1: 'اسحب ملف PDF هنا أو دوس واختار', drop2: 'أو صور الصفحات بالترتيب، أو book.json',
      book: 'بيانات الكتاب', title: 'عنوان الكتاب', author: 'اسم المؤلف', org: 'المدرسة / الجهة', grade: 'الصف', subject: 'المادة', yt: 'لينك فيديو يوتيوب (اختياري) — هيتضاف صفحة فيديو في أول الدرس', ytPage: 'فيديو الدرس', ytBad: 'اللينك ده مش لينك يوتيوب',

      quality: 'جودة الصفحات', q1: 'خفيفة', q2: 'عادية', q3: 'عالية', hard: 'غلاف مقوّى للأول والآخر', sound: 'صوت تقليب الورق',
      split: 'قسّم الصفحات المزدوجة (سكان)', export: '⬇️ نزّل الكتاب كملف HTML واحد', exportJson: 'نزّل book.json للتعديل',
      empty: 'الكتاب هيظهر هنا وتقدر تقلّبه وتجرّبه قبل ما تنزّله', reading: 'بقرا الملف…', page: 'بجهّز صفحة', of: 'من',

    en: { tag: 'From PDF to a book that really turns', drop1: 'Drop a PDF here or click to choose', drop2: 'or page images in order, or a book.json',
      book: 'Book details', title: 'Title', author: 'Author', org: 'School / organisation', grade: 'Grade', subject: 'Subject', yt: 'YouTube video link (optional) — adds a video page at the start of the lesson', ytPage: 'Lesson video', ytBad: 'That is not a YouTube link',
      look: 'Look and sound', dir: 'Reading direction', auto: 'Automatic', rtl: 'Right to left (Arabic)', ltr: 'Left to right',
      quality: 'Page quality', q1: 'Light', q2: 'Standard', q3: 'High', hard: 'Hard covers on first and last page', sound: 'Paper turning sound',

  };
  var THEMES = [['classic', '#2f5fa8', '#16305e'], ['ocean', '#0f5c80', '#062a44'], ['nature', '#2f6b3e', '#173a22'], ['cosmic', '#3b1d73', '#0d0726'],
    ['sunset', '#c2522b', '#6d1f3d'], ['vintage', '#6b3f22', '#33190b'], ['blossom', '#c45a7c', '#6e2341'], ['arctic', '#7fb5cf', '#2c5d78'],
    ['royal', '#4b1f6e', '#1f0a33'], ['desert', '#b9822f', '#5e3a12'], ['chalkboard', '#24382e', '#5b3a22'], ['blueprint', '#123a63', '#061a30']];
  var packs = window.__MB__.packs;
  if (Object.hasOwn(packs, 'studio')) THEMES.push(['studio', '#82CAFA', '#B84559']);
  var ui = 'ar', theme = 'ocean', themePack, pages = [], aspect = .72, detected = 'ltr', book = null, srcName = 'book', imported = null;
  var $ = function (id) { return document.getElementById(id); };
  var themeStyle = document.createElement('style');
  document.head.appendChild(themeStyle);
  // fonts travel inside this file (no Google Fonts): install them for the Studio and its preview
  var fontStyle = document.createElement('style');
  fontStyle.textContent = (window.__MB__.fonts || []).map(function (f) { return f.rule; }).join('\n');
  document.head.insertBefore(fontStyle, document.head.firstChild);
  function fontsFor(m, text) {              // the same choice as tools/build_book.py fonts_for()
    var lang = m.lang || (m.dir === 'rtl' ? 'ar' : 'en'), th = m.themePack || m.theme, fams = {};
    (m.themePack === 'studio' ? ['Baloo Bhaijaan 2', 'Nunito'] : lang === 'ar' ? ['Cairo', 'Noto Naskh Arabic'] : ['Fraunces', 'Inter']).forEach(function (f) { fams[f] = 1; });
    if (th === 'chalkboard') fams['Patrick Hand'] = 1;
    return (window.__MB__.fonts || []).filter(function (f) { return (fams[f.family] || text.indexOf(f.family) >= 0) && !(f.subset === 'arabic' && lang !== 'ar'); })
      .map(function (f) { return f.rule; }).join('\n');
  }

  function updateSwatches() {
    Array.prototype.forEach.call($('themes').children, function (button) {
      button.setAttribute('aria-pressed', String(button.dataset.theme === (themePack || theme)));
    });
  }

  function applyLang() {
    document.documentElement.lang = ui; document.documentElement.dir = ui === 'ar' ? 'rtl' : 'ltr';
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (e) { e.textContent = T[ui][e.getAttribute('data-t')] || ''; });
    $('lang').textContent = ui === 'ar' ? 'EN' : 'عربي';
  }
  $('lang').onclick = function () { ui = ui === 'ar' ? 'en' : 'ar'; applyLang(); };
  THEMES.forEach(function (t) {
    var b = document.createElement('button'); b.type = 'button'; b.title = t[0];
    b.style.background = 'linear-gradient(135deg,' + t[1] + ',' + t[2] + ')';
    b.dataset.theme = t[0];
    b.onclick = function () {
      themePack = Object.hasOwn(packs, t[0]) ? t[0] : undefined;
      theme = t[0]; updateSwatches(); refresh();
    };
    $('themes').appendChild(b);
  });
  updateSwatches();
  applyLang();

  function status(s, pct) { $('status').textContent = s; if (pct != null) $('bar').style.width = pct + '%'; }

  // ---------- input ----------
  var drop = $('drop'), file = $('file');
  drop.onclick = function () { file.click(); };
  drop.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') file.click(); };
  ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });

    var json = files.filter(function (f) { return /\.json$/i.test(f.name); })[0];
    var imgs = files.filter(function (f) { return /^image\//.test(f.type); }).sort(function (a, b) { return a.name.localeCompare(b.name, undefined, { numeric: true }); });
    srcName = (pdf || json || imgs[0] || { name: 'book' }).name.replace(/\.[^.]+$/, '');
    if (!$('title').value) $('title').value = srcName.replace(/[_-]+/g, ' ');
    if (pdf) return fromPdf(pdf);
    if (json) return fromJson(json);
    if (imgs.length) return fromImages(imgs);
    status(T[ui].bad, 0);
  }

  function encode(canvas) {
    var d = canvas.toDataURL('image/webp', .82);
    if (d.indexOf('data:image/webp') !== 0) d = canvas.toDataURL('image/jpeg', .85);   // Safari cannot write WebP
    return d;
  }

  function fromPdf(f) {
    imported = null;
    status(T[ui].reading, 2);
    var lib = window.pdfjsLib;
    f.arrayBuffer().then(function (buf) {
      // isEvalSupported:false closes CVE-2024-4367 in pdf.js 3.x
      return lib.getDocument({ data: buf, isEvalSupported: false }).promise;
    }).then(function (doc) {
      var width = +$('quality').value, split = $('split').checked, out = [], arabic = 0, letters = 0, n = doc.numPages;
      var chain = Promise.resolve();
      for (var i = 1; i <= n; i++) (function (i) {
        chain = chain.then(function () { return doc.getPage(i); }).then(function (page) {
          var vp1 = page.getViewport({ scale: 1 }), spread = split && vp1.width > vp1.height * 1.15;
          var scale = (spread ? width * 2 : width) / vp1.width, vp = page.getViewport({ scale: scale });
          var c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
          var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
          return page.render({ canvasContext: ctx, viewport: vp }).promise.then(function () { return page.getTextContent(); }).then(function (tc) {
            var text = tc.items.map(function (x) { return x.str; }).join(' ').replace(/\s+/g, ' ').trim();
            arabic += (text.match(/[؀-ۿ]/g) || []).length; letters += (text.match(/\p{L}/gu) || []).length;
            if (spread) {
              var h = c.width / 2;
              [0, 1].forEach(function (k) {
                var cc = document.createElement('canvas'); cc.width = h; cc.height = c.height;
                cc.getContext('2d').drawImage(c, k * h, 0, h, c.height, 0, 0, h, c.height);
                out.push({ image: encode(cc), narration: k === 0 ? text : '', w: h, h: c.height });
              });
            } else out.push({ image: encode(c), narration: text, w: c.width, h: c.height });
            status(T[ui].page + ' ' + i + ' ' + T[ui].of + ' ' + n, Math.round(i / n * 100));
          });
        });
      })(i);
      return chain.then(function () {
        pages = out; aspect = out[0] ? +(out[0].w / out[0].h).toFixed(4) : .72;
        detected = letters && arabic / letters > .4 ? 'rtl' : 'ltr';
        refresh(); status(T[ui].ready, 100);
      });
    }).catch(function (e) { status('⚠️ ' + e.message, 0); });
  }

  function fromImages(files) {
    imported = null; status(T[ui].reading, 2);
    var out = [], width = +$('quality').value;
    var chain = Promise.resolve();
    files.forEach(function (f, i) {
      chain = chain.then(function () {
        return new Promise(function (res) {
          var img = new Image(); img.onload = function () {
            var s = Math.min(1, width / img.width), c = document.createElement('canvas');
            c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            out.push({ image: encode(c), narration: '', w: c.width, h: c.height });
            URL.revokeObjectURL(img.src); status(T[ui].page + ' ' + (i + 1) + ' ' + T[ui].of + ' ' + files.length, Math.round((i + 1) / files.length * 100)); res();
          };
          img.onerror = function () { res(); };
          img.src = URL.createObjectURL(f);
        });
      });
    });
    chain.then(function () { pages = out; aspect = out[0] ? +(out[0].w / out[0].h).toFixed(4) : .72; detected = 'ltr'; refresh(); status(T[ui].ready, 100); });
  }

  function fromJson(f) {
    f.text().then(function (t) { loadBook(JSON.parse(t), false); }).catch(function (e) { status('⚠️ ' + e.message, 0); });
  }
  // one loader for a book.json file and for a book pasted from ChatGPT / Gemini
  function loadBook(next, fromAi) {
    var m = next.meta || {};
    if (!fromAi && 'themePack' in m && !Object.hasOwn(packs, m.themePack)) throw new Error('Unknown theme pack: ' + m.themePack);
    imported = next;
    ['title', 'author', 'org', 'grade', 'subject'].forEach(function (k) { if (m[k] && (!fromAi || !$(k).value)) $(k).value = m[k]; });
    if (m.dir) $('dir').value = m.dir;
    if (!fromAi) { if (m.theme) theme = m.theme; themePack = m.themePack; updateSwatches(); }   // a pasted book keeps the look chosen here
    if (fromAi) $('yt').value = '';                               // its video page (if any) is already inside the book
    pages = []; refresh(); status(T[ui].ready, 100);
    if (fromAi && matchMedia('(max-width:820px)').matches) setTimeout(function () { document.querySelector('main').scrollIntoView({ behavior: 'smooth' }); }, 300);   // phone: show the book
  }

  // ---------- book data ----------
  function makeBook() {
    var dir = $('dir').value === 'auto' ? (imported && imported.meta && imported.meta.dir) || detected : $('dir').value;
    var lang = dir === 'rtl' ? 'ar' : 'en', hard = $('hard').checked;
    var meta = Object.assign({}, imported ? imported.meta : {}, {
      id: ($('title').value || srcName).trim().replace(/\s+/g, '-').toLowerCase(),
      title: $('title').value || srcName, author: $('author').value || undefined, org: $('org').value || undefined,
      grade: $('grade').value || undefined, subject: $('subject').value || undefined,
      lang: lang, dir: dir, theme: themePack || theme, themePack: themePack, sound: { enabled: $('sound').checked, volume: .7 }
    });
    if (!imported) meta.aspect = aspect;
    var list;
    if (imported) list = imported.pages;
    else list = pages.map(function (p, i) {
      var o = { type: 'image', image: p.image, title: i === 0 ? (lang === 'ar' ? 'الغلاف' : 'Cover') : (lang === 'ar' ? 'صفحة ' : 'Page ') + (i + 1) };
      if (p.narration) o.narration = p.narration.slice(0, 1500);
      if (hard && (i === 0 || (i === pages.length - 1 && pages.length > 2))) o.hard = true;
      return o;
    });
    var yt = ytId($('yt').value);
    if (yt && !list.some(function (p) { return p.type === 'video' && ytId(p.youtube || p.url) === yt; })) { list = list.slice(); var at = list[1] && /tocrow/.test(list[1].html || '') ? 2 : 1; list.splice(Math.min(at, list.length - 1), 0, { type: 'video', title: T[ui].ytPage, youtube: yt }); }   // the video opens the lesson
    return { meta: meta, pages: list, quiz: imported ? imported.quiz || [] : [] };
  }

  function ytId(s) { s = String(s || '').trim(); var m = s.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(s) ? s : ''); }
  var live = null;
  function preparedBook(bookData) {
    var b = Object.assign({}, bookData), m = b.meta = Object.assign({}, b.meta);
    if (m.themePack && Object.hasOwn(packs, m.themePack)) m.theme = m.themePack;
    if (m.themePack === 'studio' && Object.hasOwn(window.__MB__.studioCovers, m.subjectTag)) {
      var art = window.__MB__.studioCovers[m.subjectTag];
      if (!m.coverImage && art.coverImage) m.coverImage = art.coverImage;
      if (!m.backImage && art.backImage) m.backImage = art.backImage;
    }
    return b;
  }
  function refresh() {
    if (!pages.length && !imported) return;
    book = makeBook();
    $('empty').style.display = 'none';
    if (live) live.destroy();
    var host = $('preview'); host.innerHTML = '';
    var root = document.createElement('div'); root.style.cssText = 'position:absolute;inset:0'; host.appendChild(root);
    themeStyle.textContent = themePack ? packs[themePack].css : '';
    var effects = themePack === 'studio' ? window.MorphBookTheme : undefined;
    var preview = preparedBook(book);
    live = MorphBook.mount(root, JSON.parse(JSON.stringify(preview)), Object.assign({}, effects, { restore: false, studio: true }));
    $('export').disabled = false; $('exportJson').disabled = false; $('share').disabled = false;
    if (typeof renderPics === 'function') renderPics();
  }
  ['title', 'author', 'org', 'grade', 'subject', 'yt'].forEach(function (k) { var t; $(k).addEventListener('input', function () { clearTimeout(t); t = setTimeout(refresh, 500); }); });
  ['dir', 'hard', 'sound'].forEach(function (k) { $(k).addEventListener('change', refresh); });

  // ---------- export ----------
  function download(name, text, type) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    status(T[ui].exported);
  }
  function slug() { return (book.meta.title || 'book').trim().replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, '-') || 'book'; }
  function withPictures(b) {          // pictures uploaded into picture pages in the preview travel with the book
    var imgs = live && live.ext && live.ext.allImages && live.ext.allImages();
    if (!imgs || !Object.keys(imgs).length) return b;
    var c = Object.assign({}, b); c.meta = Object.assign({}, b.meta, { images: Object.assign({}, b.meta.images || {}, imgs) }); return c;
  }
  function standalone(b) {
    b = preparedBook(withPictures(b));
    var B = window.__MB__, m = b.meta;
    var pack = Object.hasOwn(packs, m.themePack) ? packs[m.themePack] : {};
    var data = JSON.stringify(b).replace(/<\//g, '<\\/');
    var bookText = (b.css || '') + b.pages.map(function (p) { return p.html || ''; }).join('');
    var fontCss = fontsFor(m, bookText);
    return B.tpl
      .replace(/<link rel="preconnect"[^>]*>\n?/g, '').replace(/<link href="https:\/\/fonts\.googleapis\.com[^>]*>\n?/, '')
      .replace('<style>', function () { return '<style>\n' + fontCss + '\n'; })
      .replace('/*__MORPHBOOK_CSS__*/', function () { return B.css; })
      .replace('/*__THEME_CSS__*/', function () { return pack.css || ''; })
      .replace('/*__BOOK_CSS__*/', function () { return b.css || ''; })
      .replace('/*__MORPHBOOK_JS__*/', function () { return B.js; })
      .replace('/*__THEME_JS__*/', function () { return (pack.js || '').replace(/<\/script/gi, '<\\/script'); })
      .replace('__BOOK_JSON__', function () { return data; })
      .replace('__BOOK_TITLE__', function () { return String(m.title || 'Book').replace(/</g, '&lt;'); })
      .replace('__LANG__', m.lang).replace('__DIR__', m.dir).replace('__VERSION__', B.version);
  }
  $('export').onclick = function () { if (book) download(slug() + '.html', standalone(book), 'text/html'); };
  $('exportJson').onclick = function () { if (book) download(slug() + '.book.json', JSON.stringify(withPictures(book), null, 1), 'application/json'); };
/*__AI_ROUTE__*/
  window.__studio = { standalone: standalone, makeBook: makeBook };
})();
</script>
